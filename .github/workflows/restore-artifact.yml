name: Restore Artifact

on:
  push:
    branches: ['**']

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest artifact from Store Artifact workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download \
            --repo ${{ github.repository }} \
            --name source-code \
            --dir restored-artifact \
            $(gh run list --repo ${{ github.repository }} --workflow "Store Artifact" --branch ${{ github.ref_name }} --status success --limit 1 --json databaseId --jq '.[0].databaseId')

      - name: List restored files
        run: ls -la restored-artifact
